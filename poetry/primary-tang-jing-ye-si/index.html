    <meta name="description" content="明亮的月光洒在床前的窗户纸上，好像地上泛起了一层霜。我抬起头来，看那天窗外空中的一轮明月，不由得低头沉思，想起远方的家乡。 全诗语言清新朴素，运用比喻和动作描写，把游子的思乡之情表达得含蓄而深远。短短二十字，写尽了静夜望月触发的乡愁，是千古传诵的思乡名作。" />

</div></section><div class="text-center"><button type="button" class="text-xs text-[#3370FF] hover:underline">隐藏拼音</button></div><hr class="border-t border-[#F0F1F2]"/><section class="space-y-2"><h2 class="text-sm font-medium text-[#646A73] flex items-center gap-2"><span aria-hidden="true">📖</span>译文</h2><p class="text-base text-[#1F2329] leading-relaxed">明亮的月光洒在床前的窗户纸上，好像地上泛起了一层霜。我抬起头来，看那天窗外空中的一轮明月，不由得低头沉思，想起远方的家乡。</p></section><hr class="border-t border-[#F0F1F2]"/><section class="space-y-2"><h2 class="text-sm font-medium text-[#646A73] flex items-center gap-2"><span aria-hidden="true">✨</span>赏析</h2><p class="text-base text-[#1F2329] leading-relaxed">全诗语言清新朴素，运用比喻和动作描写，把游子的思乡之情表达得含蓄而深远。短短二十字，写尽了静夜望月触发的乡愁，是千古传诵的思乡名作。</p></section></article></div><!--/$--></div>
