    <meta name="description" content="春日里贪睡不知不觉天就亮了，到处可以听见小鸟的啼鸣声。回想昨夜的阵阵风雨声，不知吹落了多少娇美的春花。 诗人抓住春天的早晨刚刚醒来时的一瞬间展开联想，描绘了春天早晨的明媚景色和诗人对落花的惋惜，语言平易浅近，却富有诗情画意。" />
