name = "school-formula-api"
main = "worker/index.ts"
compatibility_date = "2026-09-06"
compatibility_flags = ["nodejs_compat"]

# apex 站点的路由也要写在这里。
#
# 之前这里只有 api.*，而 `[site] bucket = "./dist"` 被 wrangler 3.x 静默忽略
# （`wrangler deploy --dry-run` 的绑定列表里既没有 ASSETS 也没有 __STATIC_CONTENT）——
# 于是 worker/index.ts 里所有静态服务逻辑（目录索引、/en/ 下真 404、规范域名 301、
# 6 条旧 URL 301）在线上从来没有执行过，worker 里那段是死代码。
# 实测：api.syy.global 上未匹配路径返回纯文本 404 而不是 SPA 外壳，即 env.ASSETS 为 undefined。
routes = [
  { pattern = "syy.global/*", zone_name = "syy.global" },
  { pattern = "syy.mobi/*", zone_name = "syy.mobi" },
  { pattern = "syy.one/*", zone_name = "syy.one" },
  { pattern = "api.syy.global/*", zone_name = "syy.global" },
  { pattern = "api.syy.mobi/*", zone_name = "syy.mobi" },
  { pattern = "api.syy.one/*", zone_name = "syy.one" }
]

[[d1_databases]]
binding = "DB"
database_name = "school-formula-db"
database_id = "21a53ef9-a1ea-434d-9c18-f3619421f011"
# 迁移文件在 worker/migrations，而 wrangler 默认找 ./migrations——不设这一行，
# CI 的 "Apply D1 migrations" 步骤会直接报 "No migrations present" 并中断部署。
migrations_dir = "worker/migrations"

[[kv_namespaces]]
binding = "SESSIONS"
id = "e7c94f92016f4458863363fb666b5b33"

# Workers Static Assets，取代已废弃的 [site]（Workers Sites）。
# binding 必须叫 ASSETS——worker/index.ts 读的就是 env.ASSETS。
#
# 两个旋钮刻意留默认值，因为它们正好匹配现网行为：
#   html_handling 默认 auto-trailing-slash → /en/math 会 308 到 /en/math/（现网实测就是这个）
#   not_found_handling 默认 none → 未匹配路径交给 Worker 自己处理。**不要**在这里开
#     single-page-application：中文站的 SPA 兜底写在 worker/index.ts 里，而且 /en/ 下
#     需要真 404 而不是 200 空壳，那是本分支要的语义。
[assets]
directory = "./dist"
binding = "ASSETS"

[vars]
FRONTEND_URL = "https://syy.global"
# AI 上游 Base URL，Worker 会拼 /chat/completions。
# 当前直连 DeepSeek：有 key 就够，不需要先建 AI Gateway。
# 想换成网关（要缓存/日志/重试）时改成下面这行，并按 docs/cloudflare-ai.md 补 cf-aig-authorization：
# AI_GATEWAY_BASE = "https://gateway.ai.cloudflare.com/v1/<account_id>/<gateway_id>/deepseek"
# 留空则 AI 接口返回 503 GATEWAY_NOT_CONFIGURED。
AI_GATEWAY_BASE = "https://api.deepseek.com"
# 网关 Token / 或直连时的 provider key。**生产请用 `wrangler secret put`**，
# 不要在这个文件里写真实值（[vars] 是明文且会提交进 git）。
AI_GATEWAY_TOKEN = ""
# DeepSeek 现行模型名：deepseek-flash（默认，便宜快）/ deepseek-v4-pro（复杂推理）。
# 旧名 deepseek-chat / deepseek-reasoner 已于 2026-07-24 下线，别再使用。
AI_GATEWAY_MODEL = "deepseek-flash"
# DeepSeek V4 默认开启 thinking（首 token 要等推理结束）。家长辅导场景关掉更跟手。
AI_THINKING = "disabled"
FROM_EMAIL = "noreply@syy.global"
# 邮件通道（二选一，详见 docs/email.md）：
# 1) Cloudflare Email Service：控制台 onboard syy.global 后，取消下面两行注释并重新部署
# [[send_email]]
# name = "EMAIL"
# 2) Resend：npx wrangler secret put RESEND_API_KEY
# 注意：MailChannels 免费接口已于 2024-06-30 停止，旧的 api.mailchannels.net 调用会 401。
ALLOWED_ORIGINS = "https://syy.global,https://syy.mobi,https://syy.one"
ENVIRONMENT = "production"
