name = "school-formula-api"
main = "worker/index.ts"
compatibility_date = "2026-09-06"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "api.syy.global/*", zone_name = "syy.global" },
  { pattern = "api.syy.mobi/*", zone_name = "syy.mobi" },
  { pattern = "api.syy.one/*", zone_name = "syy.one" }
]

[[d1_databases]]
binding = "DB"
database_name = "school-formula-db"
database_id = "21a53ef9-a1ea-434d-9c18-f3619421f011"

[[kv_namespaces]]
binding = "SESSIONS"
id = "e7c94f92016f4458863363fb666b5b33"

[site]
bucket = "./dist"

[vars]
FRONTEND_URL = "https://syy.global"
# AI Gateway（Cloudflare），用户免费层：<a href="https://ai.cloudflare.com">ai.cloudflare.com</a> 手动创建网关后填网关 Base URL（留空则 AI 接口返回 503 GATEWAY_NOT_CONFIGURED）
AI_GATEWAY_BASE = ""
# Workers 调网关的鉴权 Token（在网关生成 Service Token 或 Cloudflare API Token）
AI_GATEWAY_TOKEN = ""
AI_GATEWAY_MODEL = "deepseek-chat"
FROM_EMAIL = "noreply@syy.global"
ALLOWED_ORIGINS = "https://syy.global,https://syy.mobi,https://syy.one"
ENVIRONMENT = "production"
