<script>
  for (const b of document.querySelectorAll('[data-toggle-py]')) {
    b.addEventListener('click', () => {
      const hide = document.documentElement.classList.toggle('hide-py');
      try { localStorage.setItem('hide-py', hide ? '1' : '0'); } catch (e) {}
    });
  }
  // 朗读：用浏览器自带的中文语音读 data-say 的内容。浏览器不支持时什么也不做。
  if ('speechSynthesis' in window) {
    document.documentElement.classList.add('can-say');
    for (const b of document.querySelectorAll('button.speak')) b.hidden = false;
    document.addEventListener('click', e => {
      const el = e.target.closest('[data-say]');
      if (!el) return;
      const u = new SpeechSynthesisUtterance(el.dataset.say);
      u.lang = 'zh-CN';
      u.rate = 0.8;
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
    });
  }
</script>
