name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Frontend to Cloudflare Workers
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # 注意：项目刻意不跟踪 package-lock.json（见 .gitignore），
          # 因此不能开启 cache: 'npm'，否则 setup-node 会因找不到锁文件而报错。

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        # VITE_* 是**构建期**替换的，不是运行时读的，所以变量必须在这里给。
        # 少这一句，VITE_GA4_ID 永远不会出现在生产构建里，GA4 等于没接。
        # secret 没配时 GitHub 传空串，构建仍然正常（只是不注入分析标签）。
        env:
          VITE_GA4_ID: ${{ secrets.VITE_GA4_ID }}
          VITE_ADSENSE_SLOT_KNOWLEDGE_MID: ${{ secrets.VITE_ADSENSE_SLOT_KNOWLEDGE_MID }}
          VITE_ADSENSE_SLOT_KNOWLEDGE_BOTTOM: ${{ secrets.VITE_ADSENSE_SLOT_KNOWLEDGE_BOTTOM }}
          VITE_ADSENSE_SLOT_REFERENCE_BOTTOM: ${{ secrets.VITE_ADSENSE_SLOT_REFERENCE_BOTTOM }}
        run: npm run build

      # 远端库可能从未跑过 db/schema.sql（部署历史上只在本地建过库）。
      # schema.sql 全是 CREATE TABLE IF NOT EXISTS，重复执行安全；先补齐基础表，
      # 再让 migrations 里的 ALTER TABLE 有表可改。
      - name: Ensure base schema
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute school-formula-db --remote --file=db/schema.sql --yes

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply school-formula-db --remote

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
